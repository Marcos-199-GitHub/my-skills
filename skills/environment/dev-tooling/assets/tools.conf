# Manifiesto de herramientas del agente
#
# Formato:  name|version|scope|method|pkg|version-cmd|install
#
#   name        identificador de la herramienta (reportes y --only)
#   version     intencion de version:
#                 latest  el instalador corre el comando SIEMPRE y el gestor
#                         decide si actualiza. Es el default.
#                 lts     igual que latest, pero el canal es el LTS (no majors).
#                 Para runtimes de lenguaje.
#                 X.Y.Z   pin: solo actualiza si la instalada es menor. Usar
#                         solo cuando una major rompa de verdad.
#   scope       user    -> instalacion del usuario (home, nvm, npm -g, /usr/local)
#               project -> local al repo, en ./.tools
#   method      como se instala:
#                 apt dnf apk pacman brew choco scoop winget npm pipx pip
#                 cargo go script docker auto none
#   pkg         el paquete a instalar (segun method). Para docker: la imagen.
#   version-cmd comando que imprime la version instalada. Admite alternativas
#               separadas por ";" (se prueba la primera que imprima una
#               version): sirve cuando el binario tiene nombres distintos
#               segun la plataforma ("fdfind" en Debian, "fd" en brew).
#   install     comando explicito. Para method=script es el comando a correr,
#               y admite variantes por plataforma separadas con ";;":
#                 linux=<cmd> ;; darwin=<cmd> ;; windows=<cmd>
#               Para los demas metodos es la ALTERNATIVA cuando el metodo no
#               existe en la maquina (apt no existe en macOS): si hay una
#               variante para el SO actual, se usa esa; si no, la herramienta
#               se omite.
#               Para method=docker/auto: el comando DENTRO de la imagen.
#               VACIO = el entrypoint de la imagen ya es la herramienta: el
#               wrapper no pasa comando. Importa: si la imagen tiene su
#               entrypoint puesto (yamllint, actionlint, gitleaks, uv) y
#               se le pasa el nombre igual, la herramienta recibe su
#               propio nombre como argumento y falla ("unknown command").
#
# El separador de campos es "|" y no puede aparecer en ningun campo.
#
# El pin casi nunca se necesita: un pin viejo obliga a actualizar el manifiesto
# cada X meses, y un pin viejo es peor que no tener pin. Solo se pinea cuando
# una major rompa de verdad y queres congelar el estado.
#
# QUE ENTRA ACA: lo que un agente necesita SIN IMPORTA el proyecto.
# Para que algo entre: no puede existir ya otra herramienta que haga lo mismo,
# tiene que ser la mejor para ese trabajo, y si se complementa con otra, el
# catalogo (references/tool-catalog.md) dice cual va con cual.
#
# Lo especifico de un proyecto va en <proyecto>/.agent-tools.conf.
#
# DOCKER: los toolchains (python, node, java, kotlin, dotnet, go, rust...) van
# como imagen Docker en el manifiesto del proyecto. Son pesados, contaminan la
# maquina y solo hacen falta si hay un proyecto de ese lenguaje. El resto del
# universal son binarios chicos que no contaminan y se llaman seguido: van
# nativos.

# --- entender: recorrer y buscar codigo --------------------------------------
ripgrep|latest|user|apt|ripgrep|rg --version|darwin=brew install ripgrep ;; windows=scoop install ripgrep
fd-find|latest|user|apt|fd-find|fdfind --version; fd --version|darwin=brew install fd ;; windows=scoop install fd
git|latest|user|apt|git|git --version|darwin=brew install git ;; windows=scoop install git

# --- leer: parsear formatos que no son codigo -------------------------------
jq|latest|user|apt|jq|jq --version|darwin=brew install jq ;; windows=scoop install jq
yq|latest|user|apt|yq|yq --version|darwin=brew install yq ;; windows=scoop install yq

# --- editar: transformar y formatear -----------------------------------------
prettier|latest|user|auto|node:lts-alpine|prettier --version|npx --yes prettier@latest

shfmt|latest|user|auto|golang:1-alpine|shfmt --version|go run mvdan.cc/sh/v3/cmd/shfmt@latest

ast-grep|latest|user|auto|node:lts-alpine|ast-grep --version|npx --yes -p @ast-grep/cli ast-grep

# --- verificar: lint y analisis estatico --------------------------------------
shellcheck|latest|user|apt|shellcheck|shellcheck --version|darwin=brew install shellcheck ;; windows=scoop install shellcheck
yamllint|latest|user|auto|cytopia/yamllint:latest|yamllint --version|

markdownlint|latest|user|auto|node:lts-alpine|markdownlint --version|npx --yes markdownlint-cli

actionlint|latest|user|auto|rhysd/actionlint:latest|actionlint --version|

hadolint|latest|user|auto|hadolint/hadolint:latest|hadolint --version|/bin/hadolint


# --- seguridad: que no se filtren secretos -----------------------------------
gitleaks|latest|user|auto|zricethezav/gitleaks:latest|gitleaks --version|



# --- red ----------------------------------------------------------------------
# curl es dependencia de las recetas de tea y docker en este manifiesto: sin
# ella esas dos herramientas no se pueden instalar en Linux.
curl|latest|user|apt|curl|curl --version|darwin=brew install curl ;; windows=scoop install curl

# --- runtimes y gestores de paquetes ------------------------------------------
# uv es el gestor de Python: instala runtimes, herramientas y resuelve
# dependencias. Los runtimes (node, python3) NO van aca: son toolchains, y
# van como imagen en el manifiesto del proyecto.
uv|latest|user|auto|ghcr.io/astral-sh/uv:latest|uv --version|

# --- containers ---------------------------------------------------------------
docker|latest|user|script||docker --version|linux=curl -fsSL https://get.docker.com -o /tmp/docker-install.sh && sh /tmp/docker-install.sh ;; darwin=brew install --cask docker ;; windows=choco install -y docker-desktop

# --- vcs y colaboradores ------------------------------------------------------
gh|latest|user|apt|gh|gh --version|darwin=brew install gh ;; windows=scoop install gh
tea|latest|user|script||tea --version|linux=ver=$(grep -oE "\"tag_name\":\s*\"v[0-9.]+\"" <<< "$(curl -fsSL https://gitea.com/api/v1/repos/gitea/tea/releases/latest)"); ver=${ver##*v}; ver=${ver%%\"*}; curl -fsSL "https://gitea.com/gitea/tea/releases/download/v${ver}/tea-${ver}-linux-{{GOARCH}}" -o {{BINDIR}}/tea && chmod +x {{BINDIR}}/tea ;; darwin=ver=$(grep -oE "\"tag_name\":\s*\"v[0-9.]+\"" <<< "$(curl -fsSL https://gitea.com/api/v1/repos/gitea/tea/releases/latest)"); ver=${ver##*v}; ver=${ver%%\"*}; curl -fsSL "https://gitea.com/gitea/tea/releases/download/v${ver}/tea-${ver}-darwin-{{GOARCH}}" -o {{BINDIR}}/tea && chmod +x {{BINDIR}}/tea ;; windows=scoop install tea
